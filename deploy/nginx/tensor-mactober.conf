# /etc/nginx/sites-available/tensor-mactober  (enabled via symlink in sites-enabled)
# Proxies tensor-typing.98-70-53-61.sslip.io to the Next.js server on 127.0.0.1:3100.
# Certificate: sudo certbot certonly --webroot -w /var/www/html -d tensor-typing.98-70-53-61.sslip.io
#
# No per-IP rate limiting on purpose: a whole classroom can share one NAT address.

server {
    listen 80;
    listen [::]:80;
    server_name tensor-typing.98-70-53-61.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tensor-typing.98-70-53-61.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/tensor-typing.98-70-53-61.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tensor-typing.98-70-53-61.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (don't append): the admin login rate limiter trusts the
    # first X-Forwarded-For entry, so clients must not be able to spoof it.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
